<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>馬力歐大逃亡 (全球排行榜)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .game-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }
        
        /* 🌟 新增：用來包住畫布和開始畫面的外框 */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        #gameCanvas {
            background-color: #FFF8DC;
            border: 4px solid #8B4513;
            border-radius: 10px;
            width: 100%;
            height: auto; 
            aspect-ratio: 800 / 250;
            display: block;
            touch-action: none;
        }

        /* 🌟 新增：開始畫面遮罩與按鈕 UI */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10; /* 確保蓋在畫布最上層 */
        }
        .start-title {
            color: #FFD700;
            font-size: 2.5em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #8B4513, -2px -2px 0 #8B4513, 2px -2px 0 #8B4513, -2px 2px 0 #8B4513;
            text-align: center;
        }
        .start-btn {
            background-color: #e52521; /* 馬力歐紅 */
            color: white;
            border: 4px solid #fff;
            border-radius: 10px;
            padding: 10px 40px;
            font-size: 1.5em;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .start-btn:active {
            transform: scale(0.95);
            background-color: #c01010;
        }

        .instructions {
            margin-top: 10px;
            color: #5c3a21;
            text-align: center;
            padding: 0 10px;
            font-weight: 500;
        }
        kbd {
            background-color: #eee;
            border-radius: 3px;
            border: 1px solid #b4b4b4;
            box-shadow: 0 1px 1px rgba(0,0,0,.2), 0 2px 0 0 rgba(255,255,255,.7) inset;
            color: #333;
            display: inline-block;
            font-size: 0.85em;
            font-weight: 700;
            padding: 2px 4px;
        }
        
        .stats-badge {
            margin-top: 15px;
            background-color: #34495e;
            color: #ecf0f1;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 2px solid #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-number {
            color: #f1c40f; 
            font-size: 1.3em;
        }

        .leaderboard-container {
            margin-top: 20px;
            margin-bottom: 30px;
            width: 90%;
            max-width: 400px;
            background-color: #2c3e50;
            border: 4px solid #f1c40f;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            color: white;
            padding: 15px;
        }
        .leaderboard-title {
            text-align: center;
            color: #f1c40f;
            margin: 0 0 10px 0;
            font-size: 1.5em;
            letter-spacing: 2px;
        }
        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            margin-bottom: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 1.1em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .rank-1 { color: #f1c40f; font-size: 1.2em; background-color: rgba(241, 196, 15, 0.2); }
        .rank-2 { color: #bdc3c7; }
        .rank-3 { color: #cd7f32; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="game-container">
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="250"></canvas>
            
            <div id="startScreen">
                <div class="start-title">馬力歐大逃亡</div>
                <button class="start-btn" id="startBtn">START</button>
            </div>
        </div>
        
        <div class="instructions">
            <p>💻 電腦：<kbd>空白鍵</kbd> 跳躍，<kbd>↓</kbd> 下蹲</p>
            <p>📱 手機：**點擊遊戲畫面** 跳躍，**向下滑動** 下蹲</p>
        </div>

        <div class="stats-badge">
            👁️ 全球累積遊玩： <span class="stats-number" id="viewCountDisplay">...</span> 次
        </div>

        <div class="leaderboard-container">
            <h3 class="leaderboard-title">🌍 全球排行榜 TOP 5</h3>
            <ul class="leaderboard-list" id="leaderboardList">
                <li class="leaderboard-item">載入中...</li>
            </ul>
        </div>
    </div>

    <script>
        // --- 1. Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBMa2OgrNTZhTXn-pOLJTz6a0rCxMYShPA",
            authDomain: "dino-3ebdd.firebaseapp.com",
            databaseURL: "https://dino-3ebdd-default-rtdb.firebaseio.com",
            projectId: "dino-3ebdd",
            storageBucket: "dino-3ebdd.firebasestorage.app",
            messagingSenderId: "366648298115",
            appId: "1:366648298115:web:1b47583b1fbc4a457ee9b6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const playCountRef = db.ref('globalPlayCount');
        const leaderboardRef = db.ref('leaderboard');
        
        let globalPlayCount = 0;
        let topScores = []; 

        playCountRef.on('value', (snapshot) => {
            globalPlayCount = snapshot.val() || 0;
            document.getElementById('viewCountDisplay').innerText = globalPlayCount;
        });

        function incrementGlobalPlayCount() {
            playCountRef.transaction((currentCount) => {
                return (currentCount || 0) + 1;
            });
        }

        leaderboardRef.orderByChild('score').limitToLast(5).on('value', (snapshot) => {
            let tempScores = [];
            snapshot.forEach((childSnapshot) => { tempScores.push(childSnapshot.val()); });
            topScores = tempScores.reverse();
            updateLeaderboardUI();
        });

        function updateLeaderboardUI() {
            const listElement = document.getElementById('leaderboardList');
            listElement.innerHTML = ''; 
            if (topScores.length === 0) {
                listElement.innerHTML = '<li class="leaderboard-item">目前還沒有人上榜，快來搶頭香！</li>';
                return;
            }
            topScores.forEach((entry, index) => {
                const li = document.createElement('li');
                li.className = 'leaderboard-item';
                if (index === 0) li.classList.add('rank-1');
                if (index === 1) li.classList.add('rank-2');
                if (index === 2) li.classList.add('rank-3');
                let rankIcon = ['🥇', '🥈', '🥉', '４', '５'][index] || (index + 1);
                li.innerHTML = `<span>${rankIcon} ${entry.name}</span> <span>${entry.score} 分</span>`;
                listElement.appendChild(li);
            });
        }

        // --- 2. 遊戲核心 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
            if (type === 'jump') {
                oscillator.type = 'square'; oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                oscillator.type = 'sawtooth'; oscillator.frequency.setValueAtTime(100, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.2);
            }
        }

        // 🌟 新增：遊戲狀態控制變數
        let isGameStarted = false; 
        
        let score = 0; let gameSpeed = 5; let isGameOver = false; let frameCount = 0; let obstacles = []; const groundY = 200; 

        const marioSprite = [
            "   RRRRR    ", "  RRRRRRRRR ", "  BBBSBS    ", " BSBSBBSBSSS",
            " BSBSBBBSBSS", " BBSBBBB    ", "   SSSSSSS  ", "  BBRUURBB  ",
            " BBBRUURBBB ", "BBBBURRUBBBB", "SS BBUUBB SS", "SSS UUUU SSS",
            "SS UUUUUU SS", "   UU  UU   ", "  BBB  BBB  ", " BBBB  BBBB "
        ];
        const pixelSize = 3; 

        const mario = {
            x: 80, y: groundY, width: 36, height: 48, dy: 0, gravity: 0.6, jumpForce: -11, isDucking: false,
            draw() {
                ctx.save();
                if (this.isDucking) { ctx.translate(this.x, this.y); ctx.scale(1, 0.5); ctx.translate(-this.x, -this.y); }
                for (let r = 0; r < marioSprite.length; r++) {
                    for (let c = 0; c < marioSprite[r].length; c++) {
                        let char = marioSprite[r][c];
                        if (char !== ' ') {
                            switch(char) {
                                case 'R': ctx.fillStyle = '#e52521'; break; case 'B': ctx.fillStyle = '#6b4c1a'; break; 
                                case 'S': ctx.fillStyle = '#fcae68'; break; case 'U': ctx.fillStyle = '#004394'; break; 
                            }
                            ctx.fillRect(this.x + c * pixelSize, this.y - this.height + r * pixelSize, pixelSize, pixelSize);
                        }
                    }
                }
                ctx.restore();
            },
            update() {
                this.y += this.dy; if (this.y + this.dy < groundY) this.dy += this.gravity; else { this.dy = 0; this.y = groundY; }
            },
            jump() {
                if (this.y === groundY && !this.isDucking) { this.dy = this.jumpForce; playSound('jump'); }
            }
        };

        class Obstacle {
            constructor(type) {
                this.x = canvas.width; this.type = type; this.markedForDeletion = false;
                if (this.type === 'pipe') {
                    this.width = 40 + Math.random() * 20; this.height = 30 + Math.random() * 20; this.y = groundY - this.height;
                } else {
                    this.width = 50; this.height = 25; this.y = groundY - 50; 
                }
            }
            update() { this.x -= gameSpeed; if (this.x + this.width < 0) this.markedForDeletion = true; }
            draw() {
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 1;
                if (this.type === 'pipe') {
                    ctx.fillStyle = '#006400'; ctx.fillRect(this.x, this.y + 10, this.width, this.height - 10); ctx.strokeRect(this.x, this.y + 10, this.width, this.height - 10);
                    ctx.fillStyle = '#228B22'; ctx.fillRect(this.x - 5, this.y, this.width + 10, 10); ctx.strokeRect(this.x - 5, this.y, this.width + 10, 10);
                } else if (this.type === 'bulletbill') {
                    ctx.fillStyle = '#000000'; ctx.fillRect(this.x, this.y, this.width, this.height); ctx.strokeRect(this.x, this.y, this.width, this.height);
                    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(this.x + this.width * 0.25, this.y + this.height * 0.4, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(this.x + this.width * 0.4, this.y + this.height * 0.4, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#FF0000'; ctx.fillRect(this.x + this.width * 0.3, this.y + this.height * 0.65, this.width * 0.2, 3);
                }
            }
        }

        function handleObstacles() {
            if (frameCount % 100 === 0 || (frameCount % 120 === 0 && Math.random() > 0.5)) {
                let type = Math.random() > 0.4 ? 'pipe' : 'bulletbill';
                if (obstacles.length === 0 || canvas.width - obstacles[obstacles.length-1].x > 250) obstacles.push(new Obstacle(type));
            }
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].update(); obstacles[i].draw();
                let mBox = { x: mario.x, y: mario.isDucking ? mario.y - (mario.height / 2) : mario.y - mario.height, width: mario.width, height: mario.isDucking ? mario.height / 2 : mario.height };
                let obsBox = { x: obstacles[i].x, y: obstacles[i].y, width: obstacles[i].width, height: obstacles[i].height };

                if (mBox.x < obsBox.x + obsBox.width && mBox.x + mBox.width > obsBox.x && mBox.y < obsBox.y + obsBox.height && mBox.y + mBox.height > obsBox.y) {
                    if (!isGameOver) {
                        playSound('hit'); isGameOver = true; handleGameOver();
                    }
                }
            }
            obstacles = obstacles.filter(obs => !obs.markedForDeletion);
        }

        function handleGameOver() {
            let finalScore = Math.floor(score);
            let isTop5 = false;
            if (topScores.length < 5) {
                isTop5 = true; 
            } else if (finalScore > topScores[topScores.length - 1].score) {
                isTop5 = true; 
            }

            if (isTop5 && finalScore > 0) {
                setTimeout(() => {
                    let playerName = prompt(`🎉 太神啦！${finalScore} 分！\n你擠進了全球前五名！請輸入你的大名留念（最多 8 個字）：`, "匿名玩家");
                    if (playerName !== null) {
                        playerName = playerName.trim().substring(0, 8);
                        if(playerName === "") playerName = "無名氏";
                        leaderboardRef.push({ name: playerName, score: finalScore });
                    }
                }, 100); 
            }
        }

        function drawBackground() {
            const blockSize = 20;
            for (let i = 0; i < Math.ceil(canvas.width / blockSize); i++) {
                const x = i * blockSize;
                ctx.fillStyle = '#D2691E'; ctx.fillRect(x, groundY, blockSize, blockSize);
                ctx.fillStyle = '#CD853F'; ctx.fillRect(x + 2, groundY + 2, blockSize - 4, blockSize - 4);
                ctx.fillStyle = '#8B4513'; ctx.fillRect(x + 4, groundY + 4, blockSize - 8, blockSize - 8);
            }
            ctx.fillStyle = '#5c3a21'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'right';
            ctx.fillText(`目前分數: ${Math.floor(score)}`, canvas.width - 20, 30);
        }

        // 🌟 新增：僅繪製初始靜態畫面，不開始計時與生成障礙
        function drawInitialStaticFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground(); 
            mario.draw();
        }

        function animate() {
            if (!isGameStarted) return; // 如果沒按開始，就不要跑動畫迴圈

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground(); mario.update(); mario.draw(); handleObstacles();
            
            if (!isGameOver) {
                score += 0.1; gameSpeed = 5 + Math.floor(score / 50); frameCount++; requestAnimationFrame(animate);
            } else {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white'; ctx.font = '30px Arial'; ctx.textAlign = 'center';
                ctx.fillText('遊戲結束！', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '20px Arial'; ctx.fillText(`最終分數: ${Math.floor(score)}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('點擊畫布 或 按空白鍵 重新開始', canvas.width / 2, canvas.height / 2 + 60);
            }
        }

        // 🌟 新增：點擊開始按鈕後的邏輯
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none'; // 隱藏遮罩
            if (audioCtx.state === 'suspended') audioCtx.resume(); // 解鎖音效
            isGameStarted = true;
            incrementGlobalPlayCount(); // 真正按下開始才送出遊玩次數 +1
            animate(); // 啟動遊戲迴圈
        });

        function resetGame() {
            incrementGlobalPlayCount(); 
            score = 0; gameSpeed = 5; frameCount = 0; obstacles = [];
            isGameOver = false; mario.y = groundY; mario.dy = 0; mario.isDucking = false;
            animate();
        }

        window.addEventListener('keydown', (e) => {
            if (!isGameStarted) return; // 沒按開始前鍵盤無效
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (isGameOver) resetGame(); else mario.jump();
                if(e.code === 'Space') e.preventDefault(); 
            }
            if (e.code === 'ArrowDown' && !isGameOver) { mario.isDucking = true; e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => { if (e.code === 'ArrowDown') mario.isDucking = false; });

        let touchStartY = 0; let isSwiping = false;
        canvas.addEventListener('touchstart', (e) => {
            if (!isGameStarted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (isGameOver) { resetGame(); return; }
            touchStartY = e.touches[0].clientY; isSwiping = false; e.preventDefault(); 
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            if (!isGameStarted || isGameOver) return;
            if (e.touches[0].clientY - touchStartY > 30) { mario.isDucking = true; isSwiping = true;}
            e.preventDefault();
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            if (!isGameStarted) return;
            if (mario.isDucking) mario.isDucking = false; else if (!isSwiping && !isGameOver) mario.jump();
            e.preventDefault();
        });

        // 網頁一載入時，先畫出一張靜態背景圖等待玩家
        drawInitialStaticFrame();
    </script>
</body>
</html>
